[workspace]
resolver = "2"
members = ["crates/mixtree-core", "crates/mixtree-audio", "crates/mixtree-gui"]
default-members = ["crates/mixtree-core", "crates/mixtree-audio", "crates/mixtree-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MixTree"]
repository = "https://github.com/stefanwerfling/headbangbear_client"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
