[package]
name = "mixtree-gui"
description = "MixTree native cross-platform GUI (egui/eframe) over mixtree-core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mixtree"
path = "src/main.rs"

[dependencies]
mixtree-core = { path = "../mixtree-core" }
mixtree-audio = { path = "../mixtree-audio" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
# Cross-platform app-data directory (Windows/macOS/Linux).
directories = "5"
# Decoding embedded album-cover art for the tree nodes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Native folder-picker dialog (cross-platform).
rfd = "0.15"

[features]
default = []
# Enable real cross-platform audio output via CPAL (needs libasound2-dev on
# Linux; required for audible playback on Windows/macOS).
audio-cpal = ["mixtree-audio/cpal"]
